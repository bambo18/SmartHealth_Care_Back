spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:testdb;TIME ZONE=UTC
    username: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: ${SMTP_HOST:localhost}
    username: ${SMTP_USER:test}
    password: ${SMTP_PASSWORD:test}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          port: 25
          auth: true
          starttls:
            enable: true
            required: true
  quartz:
    auto-startup: false
  security:
    oauth2:
      client:
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
          kakao:
            user-info-uri: https://kapi.kakao.com/v2/user/me

jwt:
  secret: ${JWT_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
  access-token:
    expiration:
      minutes: 15
  refresh-token:
    expiration:
      days: 7
    max-count: 10

app:
  mail:
    from: ${SMTP_FROM:test@example.com}
    allowed-emails: ${ALLOWED_EMAILS_COMMA_SEPARATED:test@example.com}
  token:
    email-verification:
      secret: ${EMAIL_VERIFICATION_SECRET:0123456789012345678901234567890123456789012345678901234567890123}
      # 이메일 인증 시도 최대 횟수
      tries:
        count: 5
        duration:
          days: 1
      # 이메일 인증 토큰 당 실패 시도 최대 횟수
      failure:
        attempts: 5
      # 이메일 인증 토큰 당 최대 실패 후 잠금 기간 (분)
      lock:
        duration:
          minutes: 30
      # 이메일 인증 토큰 만료 시간 (분)
      expiration:
        minutes: 15
    password-reset:
      expiration:
        minutes: 15

cloud:
  aws:
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}

    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY:test}
      secret-key: ${AWS_SECRET_KEY:test}
    s3:
      bucket: ${AWS_S3_BUCKET:test-bucket}
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN:cdn.example.com}

local-storage:
  url-prefix: ${LOCAL_STORAGE_URL_PREFIX:http://localhost:8080}
  ai-url-prefix: ${AI_MODEL_SERVICE_URL_PREFIX:http://localhost:8081}
  local-resource-path: ${LOCAL_RESOURCE_PATH:file:uploads/}

inference-service:
  retry:
    max-attempts: ${INFERENCE_SERVICE_RETRY_MAX_ATTEMPTS:3}
  timeout:
    seconds: ${INFERENCE_SERVICE_TIMEOUT_SECONDS:30}
  batch:
    size: ${INFERENCE_SERVICE_BATCH_SIZE:10}
  interval:
    seconds: ${INFERENCE_SERVICE_INTERVAL_SECONDS:60}

kakao:
  oauth:
    rest-api-key: ${KAKAO_REST_API_KEY:test-rest-api-key}
    client-secret: ${KAKAO_CLIENT_SECRET:test-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/oauth/kakao/callback}
    token-uri: https://kauth.kakao.com/oauth/token
