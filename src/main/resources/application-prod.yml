spring:
  application:
    name: backend

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: postgres
    password: ${DB_PASSWORD}
    baseline-on-migrate: true
    placeholders:
      ai:
        user:
          email: ${AI_MODEL_SERVICE_EMAIL}
          password-hash: ${AI_MODEL_SERVICE_PASSWORD_HASH}

  mail:
    host: ${SMTP_HOST}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          port: 25
          auth: true
          starttls:
            enable: true
            required: true

  quartz:
    auto-startup: false
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 10000
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.instanceName: ClusteredQuartzScheduler
      org.quartz.threadPool.threadCount: 5

  security:
    oauth2:
      client:
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
          kakao:
            user-info-uri: https://kapi.kakao.com/v2/user/me

  # 이 설정이 없으면 Spring 기본값 1MB가 적용되어
  # 폰으로 찍은 진단서 사진이 대부분 거부된다.
  #
  # 10MB가 아니라 7MB인 이유: OCR 요청은 이미지를 본문에 실어 보내므로
  # 원본보다 커진다. 7MB면 CLOVA OCR 요청 크기 한도 안에 안전하게 들어가고,
  # 5MB로 낮추면 압축이 강제돼 OCR 신뢰도가 떨어진다.
  # upload.image.max-size-bytes 와 반드시 같은 값을 유지한다.
  servlet:
    multipart:
      max-file-size: 7MB
      max-request-size: 9MB


jwt:
  secret: ${JWT_SECRET}

  access-token:
    expiration:
      minutes: 15

  refresh-token:
    expiration:
      days: 7
    max-count: 10


app:
  mail:
    from: ${SMTP_FROM}

  token:
    email-verification:
      secret: ${EMAIL_VERIFICATION_SECRET}

      # 이메일 인증 시도 최대 횟수
      tries:
        count: 5
        duration:
          days: 1

      # 이메일 인증 토큰 당 실패 시도 최대 횟수
      failure:
        attempts: 5

      # 이메일 인증 토큰 당 최대 실패 후 잠금 기간 (분)
      lock:
        duration:
          minutes: 30

      # 이메일 인증 토큰 만료 시간 (분)
      expiration:
        minutes: 15

    password-reset:
      expiration:
        minutes: 15


cloud:
  aws:
    region:
      static: ${AWS_REGION}

    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

    s3:
      bucket: ${AWS_S3_BUCKET}

    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN}


local-storage:
  local-resource-path: ${LOCAL_RESOURCE_PATH}


inference-service:
  retry:
    max-attempts: ${INFERENCE_SERVICE_RETRY_MAX_ATTEMPTS}

  timeout:
    seconds: ${INFERENCE_SERVICE_TIMEOUT_SECONDS}

  batch:
    size: ${INFERENCE_SERVICE_BATCH_SIZE}

  interval:
    seconds: ${INFERENCE_SERVICE_INTERVAL_SECONDS} # 사용자가 무작위로 진단 요청을 보낼 때 AI 모델 서비스에 과부하가 걸리지 않도록 요청 간격을 조절하는 데 사용


# Kakao OAuth Configuration
kakao:
  oauth:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token


# 업로드 이미지 제한
upload:
  image:
    # 이미지 크기 상한의 단일 출처.
    # spring.servlet.multipart.max-file-size 와 반드시 같은 값이어야 한다 —
    # 다르면 둘 사이 크기의 파일이 컨테이너를 통과한 뒤 INVALID_IMAGE로 거부된다.
    max-size-bytes: ${UPLOAD_IMAGE_MAX_SIZE_BYTES:7340032} # 7MB
